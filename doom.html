<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOOM.EXE — andresazcona</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --neon-cyan:#00fff9; --neon-pink:#ff00ea; --neon-green:#39ff14; --bg:#0d0221; }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family:"Courier New",monospace; padding:24px 0;
  }
  #wrap{ text-align:center; }
  h1{
    color:var(--neon-pink); text-shadow:0 0 8px var(--neon-pink),0 0 20px var(--neon-cyan);
    letter-spacing:4px; margin:0 0 14px; font-size:22px;
  }

  .scene{
    position:relative; width:900px; max-width:94vw; aspect-ratio:1600/1000;
    border-radius:10px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 45px var(--neon-pink);
  }
  .scene img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .screen{
    position:absolute;
    left:44.1%; top:22.8%; width:19.1%; height:26.7%;
    background:#000; overflow:hidden;
  }
  .screen iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .crt-fx{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%);
  }

  #hint{ color:var(--neon-green); text-shadow:0 0 6px var(--neon-green); margin-top:16px; font-size:13px; letter-spacing:1px; }
  #credit{ color:#666; font-size:11px; margin-top:4px; }
  #credit a{ color:#888; }
  a#back{ display:inline-block; margin-top:6px; color:var(--neon-cyan); text-decoration:none; font-size:12px; text-shadow:0 0 6px var(--neon-cyan); }
</style>
</head>
<body>
<div id="wrap">
  <h1>DOOM.EXE</h1>
  <div class="scene">
    <img src="retro-desk.jpg" alt="Retro computer desk">
    <div class="screen">
      <iframe src="https://archive.org/embed/dosbox-doom" allowfullscreen></iframe>
      <div class="crt-fx"></div>
    </div>
  </div>
  <div id="hint">CLICK THE SCREEN · ARROWS TO MOVE · CTRL TO SHOOT</div>
  <div id="credit">DOOM shareware &copy; id Software · played via archive.org DOSBox · 3D scene: <a href="https://sketchfab.com/3d-models/macintosh-128k-896ea439b67b4606a23fb8b93be6af6d" target="_blank">"Macintosh 128K"</a> by <a href="https://sketchfab.com/kreems" target="_blank">kreems</a> (CC BY)</div>
  <a id="back" href="https://github.com/andresazcona">&lt; back to github.com/andresazcona</a>
</div>
</body>
</html>
