<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DOOM.EXE — andresazcona</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box;}
  html,body{ margin:0; width:100%; height:100%; background:#0d0221; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  .scene{
    position:relative;
    width:min(100vw, calc(100vh * 1.6));
    height:min(100vh, calc(100vw / 1.6));
  }
  .scene img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .screen{
    position:absolute;
    left:44.1%; top:22.8%; width:19.1%; height:26.7%;
    background:#000; overflow:hidden;
  }
  .screen iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .crt-fx{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%);
  }
  #credit{
    position:fixed; bottom:6px; right:8px; z-index:10;
    font-family:monospace; font-size:10px; color:rgba(255,255,255,.35);
    text-decoration:none;
  }
  #credit:hover{ color:rgba(255,255,255,.8); }
</style>
</head>
<body>
<div class="scene">
  <img src="retro-desk.jpg" alt="Retro computer desk">
  <div class="screen">
    <iframe src="https://archive.org/embed/dosbox-doom" allowfullscreen></iframe>
    <div class="crt-fx"></div>
  </div>
</div>
<a id="credit" href="https://sketchfab.com/3d-models/macintosh-128k-896ea439b67b4606a23fb8b93be6af6d" target="_blank">3D: kreems (CC BY)</a>
</body>
</html>
