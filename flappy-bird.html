<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FLAPPY.EXE — andresazcona</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --neon-cyan:#00fff9;
    --neon-pink:#ff00ea;
    --neon-green:#39ff14;
    --bg:#0d0221;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%; background:
      radial-gradient(ellipse at 50% 0%, #2b0a4d 0%, var(--bg) 60%);
    display:flex; align-items:center; justify-content:center;
    font-family:"Courier New",monospace; padding:24px 0;
  }
  #wrap{ text-align:center; }
  h1{
    color:var(--neon-cyan); text-shadow:0 0 8px var(--neon-cyan),0 0 20px var(--neon-pink);
    letter-spacing:4px; margin:0 0 14px; font-size:22px;
  }

  /* --- retro CRT monitor --- */
  .monitor{
    width:420px; max-width:92vw; margin:0 auto;
    background:linear-gradient(#e8e2d0,#c9c2ac);
    border-radius:18px 18px 26px 26px;
    padding:22px 22px 34px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 40px var(--neon-cyan);
    position:relative;
  }
  .monitor::before{
    content:"SONY  ·  Trinitron"; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:2px; color:#6b6555;
  }
  .screen{
    position:relative; background:#000; border-radius:10px;
    box-shadow:inset 0 0 0 6px #1a1712, inset 0 0 40px 10px #000;
    overflow:hidden; aspect-ratio:360/520; touch-action:none;
  }
  .screen canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .crt-fx{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
  }
  .led{
    position:absolute; bottom:12px; right:24px; width:6px; height:6px; border-radius:50%;
    background:var(--neon-cyan); box-shadow:0 0 6px var(--neon-cyan);
  }
  .stand{ width:120px; height:16px; background:#b8b2a0; margin:0 auto; border-radius:0 0 6px 6px; }
  .base{ width:200px; height:10px; background:#a39d8c; margin:0 auto; border-radius:4px; }

  #hint{
    color:var(--neon-green); text-shadow:0 0 6px var(--neon-green);
    margin-top:14px; font-size:13px; letter-spacing:1px;
  }
  a#back{
    display:inline-block; margin-top:10px; color:var(--neon-pink);
    text-decoration:none; font-size:12px; text-shadow:0 0 6px var(--neon-pink);
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>FLAPPY.EXE</h1>
  <div class="monitor">
    <div class="screen">
      <canvas id="c" width="360" height="520"></canvas>
      <div class="crt-fx"></div>
    </div>
    <div class="led"></div>
  </div>
  <div class="stand"></div>
  <div class="base"></div>
  <div id="hint">SPACE / CLICK / TAP TO FLAP</div>
  <a id="back" href="https://github.com/andresazcona">&lt; back to github.com/andresazcona</a>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const GRAVITY = 0.45;
const FLAP = -7.5;
const PIPE_GAP = 150;
const PIPE_W = 60;
const PIPE_SPEED = 2.6;
const PIPE_INTERVAL = 95; // frames

let bird, pipes, frame, score, best, state; // state: 'ready' | 'play' | 'over'

function reset(){
  bird = { x: 90, y: H/2, vy: 0, r: 14 };
  pipes = [];
  frame = 0;
  score = 0;
  state = 'ready';
}
best = Number(localStorage.getItem('flappy_best') || 0) || 0;
reset();

function flap(){
  if (state === 'ready') state = 'play';
  if (state === 'over') { reset(); return; }
  bird.vy = FLAP;
}

window.addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); flap(); }});
cv.addEventListener('mousedown', flap);
cv.addEventListener('touchstart', e => { e.preventDefault(); flap(); }, {passive:false});

function spawnPipe(){
  const margin = 60;
  const top = margin + Math.random() * (H - PIPE_GAP - margin*2);
  pipes.push({ x: W + PIPE_W, top, passed:false });
}

function update(){
  if (state !== 'play') return;
  frame++;
  bird.vy += GRAVITY;
  bird.y += bird.vy;

  if (frame % PIPE_INTERVAL === 0) spawnPipe();

  pipes.forEach(p => p.x -= PIPE_SPEED);
  while (pipes.length && pipes[0].x < -PIPE_W) pipes.shift();

  pipes.forEach(p => {
    if (!p.passed && p.x + PIPE_W < bird.x){
      p.passed = true;
      score++;
    }
    const hitX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W;
    const hitY = bird.y - bird.r < p.top || bird.y + bird.r > p.top + PIPE_GAP;
    if (hitX && hitY) gameOver();
  });

  if (bird.y + bird.r > H || bird.y - bird.r < 0) gameOver();
}

function gameOver(){
  if (state === 'over') return;
  state = 'over';
  if (score > best){ best = score; localStorage.setItem('flappy_best', best); }
}

function drawGrid(){
  ctx.strokeStyle = 'rgba(0,255,249,0.08)';
  ctx.lineWidth = 1;
  for (let x=0;x<W;x+=20){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0;y<H;y+=20){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function drawPipe(p){
  ctx.save();
  ctx.shadowColor = '#ff00ea';
  ctx.shadowBlur = 15;
  ctx.fillStyle = '#1a0836';
  ctx.strokeStyle = '#ff00ea';
  ctx.lineWidth = 3;
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.strokeRect(p.x, 0, PIPE_W, p.top);
  ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_W, H - (p.top + PIPE_GAP));
  ctx.strokeRect(p.x, p.top + PIPE_GAP, PIPE_W, H - (p.top + PIPE_GAP));
  ctx.restore();
}

function drawBird(){
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const angle = Math.max(-0.5, Math.min(0.9, bird.vy / 12));
  ctx.rotate(angle);
  ctx.shadowColor = '#39ff14';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#39ff14';
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0d0221';
  ctx.beginPath();
  ctx.arc(5, -4, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawText(){
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00fff9';
  ctx.shadowColor = '#00fff9';
  ctx.shadowBlur = 10;
  ctx.font = 'bold 32px monospace';
  ctx.fillText(score, W/2, 50);

  if (state === 'ready'){
    ctx.font = 'bold 16px monospace';
    ctx.fillStyle = '#ff00ea';
    ctx.shadowColor = '#ff00ea';
    ctx.fillText('PRESS SPACE TO START', W/2, H/2 + 60);
  }
  if (state === 'over'){
    ctx.font = 'bold 22px monospace';
    ctx.fillStyle = '#ff00ea';
    ctx.shadowColor = '#ff00ea';
    ctx.fillText('GAME OVER', W/2, H/2);
    ctx.font = '14px monospace';
    ctx.fillStyle = '#00fff9';
    ctx.fillText('BEST: ' + best, W/2, H/2 + 26);
    ctx.fillText('PRESS SPACE TO RETRY', W/2, H/2 + 50);
  }
  ctx.shadowBlur = 0;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawGrid();
  update();
  pipes.forEach(drawPipe);
  drawBird();
  drawText();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
